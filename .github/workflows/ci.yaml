name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      # ✅ Point uv to the correct pyproject.toml in mcpagent/
      - name: Sync dependencies from pyproject.toml
        run: uv sync --project mcpagent
        working-directory: mcpagent

      # ✅ Install the project (editable mode) using src layout
      - name: Install project in editable mode
        run: uv run pip install -e mcpagent
        working-directory: mcpagent

      - name: Lint with ruff
        run: uv run ruff check mcpagent
        working-directory: mcpagent

      # ✅ Add src to PYTHONPATH for pytest
      - name: Run tests with coverage
        run: |
          uv run pytest -q --maxfail=1 --cov=mcpagent --cov-report=xml:coverage.xml
        working-directory: mcpagent

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: mcpagent/coverage.xml

      - name: Send coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: mcpagent/coverage.xml
          fail_ci_if_error: true
