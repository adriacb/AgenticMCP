name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies from pyproject.toml
        run: uv sync

      - name: Install project in editable mode
        run: uv run pip install -e ./AgenticMCP

      - name: Lint with ruff
        run: uv run ruff check ./AgenticMCP

      - name: Run tests with coverage
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/AgenticMCP
          uv run pytest -q --maxfail=1 --cov=mcpagent --cov-report=xml:coverage.xml ./AgenticMCP

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: AgenticMCP/coverage.xml

      - name: Send coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: AgenticMCP/coverage.xml
          fail_ci_if_error: true

  build-and-push:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t myorg/mcpagent:latest .
