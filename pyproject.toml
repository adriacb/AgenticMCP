[project]
name = "agenticmcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.12",
    "fastmcp>=2.12.0",
    "httpx>=0.28.1",
    "ipykernel>=6.30.1",
    "jupyter>=1.1.1",
    "lab>=8.4",
    "langchain>=0.3.27",
    "langchain-openai>=0.3.30",
    "langgraph>=0.4.8",
    "langgraph-cli[inmem]>=0.4.2",
    "mcp[cli]>=1.9.4",
    "pydantic-settings>=2.9.1",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.3.0",
    "python-a2a>=0.5.10",
    "ruff>=0.12.12",
    "structlog>=25.4.0",
]

[tool.uv.workspace]
members = ["mcpagent"]

[tool.setuptools]
packages = ["mcpagent"]

[tool.ruff]
ignore = ["F841", "F811", "F821", "F401"]  # Example: ignore unused imports and line length